name: Deploy to atlas.mbbsadda.in
# After every push to main, ask the WordPress site to pull this build into public_html/atlas/v2.
# The endpoint (a WPCode snippet on mbbsadda.in) only ever copies files from this public repo.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync on the server
        run: |
          sleep 20
          code=$(curl -sS -o out.json -w "%{http_code}" -X POST --max-time 600 https://mbbsadda.in/wp-json/atlas/v1/deploy)
          echo "HTTP $code"; cat out.json; echo
          if [ "$code" = "404" ]; then echo "Deploy snippet not installed yet"; exit 0; fi
          test "$code" = "200"
          ! grep -q '"fail"' out.json
      - name: Check the live site
        run: |
          curl -sS https://atlas.mbbsadda.in/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js'
          git ls-remote https://github.com/${{ github.repository }} main
